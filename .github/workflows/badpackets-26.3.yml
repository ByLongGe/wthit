name: Build Bad Packets for Minecraft 26.3
on:
  push:
    branches:
      - 'build/badpackets-26.3-fabric'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build workflow
        uses: actions/checkout@v4
      - name: Checkout official Bad Packets source
        uses: actions/checkout@v4
        with:
          repository: badasintended/badpackets
          ref: master
          path: badpackets
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
      - name: Configure Minecraft 26.3
        working-directory: badpackets
        run: |
          sed -i 's/minecraft          = 26.1/minecraft          = 26.3/' gradle.properties
          sed -i 's/fabricLoader       = 0.18.4/fabricLoader       = 0.19.5/' gradle.properties
          sed -i 's/fabricApi          = 0.143.14+26.1/fabricApi          = 0.161.0+26.3/' gradle.properties
          sed -i 's/26.1, 26.1.1/26.3/g' platform/fabric/gradle.properties
          sed -i 's/>=26.1-/>=26.3-/g' platform/fabric/src/main/resources/fabric.mod.json
          sed -i 's/>=0.18.4/>=0.19.5/g' platform/fabric/src/main/resources/fabric.mod.json
          sed -i 's/platform("forge")/\/\/ platform("forge")/' settings.gradle.kts
          sed -i 's/platform("neo")/\/\/ platform("neo")/' settings.gradle.kts
      - name: Build Fabric artifact
        working-directory: badpackets
        run: chmod +x gradlew && ./gradlew :fabric:build --stacktrace
        env:
          GIT_HASH: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: badpackets-fabric-26.3-${{ github.sha }}
          path: badpackets/platform/fabric/build/libs/*.jar
