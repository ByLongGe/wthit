name: WTHIT Fabric manual build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric jar
        run: ./gradlew :fabric:build --stacktrace
        env:
          GIT_HASH: ${{ github.sha }}
      - name: Upload Fabric build
        uses: actions/upload-artifact@v4
        with:
          name: wthit-fabric-26.3-${{ github.sha }}
          path: ./platform/fabric/build/libs/*.jar
          if-no-files-found: error
