name: Build Carpet Extra 26.3

on:
  push:
    branches:
      - 'build/carpet-extra-26.3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carpet-extra-26.3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test Carpet Extra
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the community 26.3 port
        uses: actions/checkout@v4
        with:
          repository: Fayberr/carpet-extra
          ref: 26.3-update
          path: carpet-extra
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: carpet-extra/**/*.gradle*

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run GameTests
        working-directory: carpet-extra
        run: ./gradlew --no-daemon clean build runGameTest --stacktrace

      - name: Prepare remapped JAR and checksum
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          jar_path="$(find carpet-extra/build/libs -maxdepth 1 -type f -name 'carpet-extra-26.3.jar' -print -quit)"
          if [[ -z "$jar_path" ]]; then
            echo 'Expected remapped JAR carpet-extra-26.3.jar was not found.'
            echo 'Available build outputs:'
            ls -la carpet-extra/build/libs || true
            exit 1
          fi
          cp "$jar_path" dist/carpet-extra-26.3.jar
          sha256sum dist/carpet-extra-26.3.jar > dist/SHA256SUMS.txt
          unzip -p dist/carpet-extra-26.3.jar fabric.mod.json > dist/fabric.mod.json
          cat dist/fabric.mod.json

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carpet-extra-26.3-${{ github.run_number }}
          path: dist/
          if-no-files-found: warn
          retention-days: 14
